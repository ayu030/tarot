<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAROT</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #00CFFF;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
    background: #00CFFF;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  h1 {
    text-align: center;
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 2rem;
    color: #fff;
    letter-spacing: 0.05em;
  }
  .controls {
    max-width: 480px;
    margin: 0 auto 2rem;
    background: #fff;
    border: 1px solid #e8e6e0;
    border-radius: 12px;
    padding: 1.5rem;
  }
  .range-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1.25rem;
  }
  .range-row label { font-size: 14px; color: #666; white-space: nowrap; }
  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    background: #e0ddd6;
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #FF1493;
    cursor: pointer;
  }
  .count-label { font-size: 14px; font-weight: 500; min-width: 32px; color: #1a1a1a; }
  .btn-wrap { position: relative; }
  button {
    width: 100%;
    padding: 12px;
    background: #FF1493;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: background 0.15s;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    overflow: hidden;
  }
  button:active { background: #e0007a; }
  button.shuffling { background: #cc006b; }
  .progress-bar {
    position: absolute;
    bottom: 0; left: 0;
    height: 3px;
    background: rgba(255,255,255,0.6);
    width: 0%;
    transition: none;
    border-radius: 0 0 8px 8px;
  }
  .grid {
    max-width: 720px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 16px;
  }
  .card {
    background: #fff;
    border: 1px solid #e8e6e0;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card img {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    display: block;
  }
  .card-info { padding: 10px 8px; text-align: center; }
  .card-en { font-size: 12px; font-weight: 500; color: #1a1a1a; line-height: 1.4; margin-bottom: 2px; }
  .card-jp { font-size: 11px; color: #666; margin-bottom: 6px; }
  .badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 6px;
  }
  .major { background: #EEEDFE; color: #3C3489; }
  .wands { background: #FAEEDA; color: #633806; }
  .heart { background: #FBEAF0; color: #72243E; }
  .sword { background: #E6F1FB; color: #0C447C; }
  .crystal { background: #EAF3DE; color: #27500A; }
  .placeholder {
    max-width: 720px;
    margin: 0 auto;
    text-align: center;
    color: #fff;
    font-size: 14px;
    padding: 3rem 0;
  }
  .hint {
    text-align: center;
    font-size: 12px;
    color: #fff;
    margin-bottom: 1.25rem;
  }
</style>
</head>
<body>

<h1>TAROT</h1>

<div class="controls">
  <div class="range-row">
    <label>枚数</label>
    <input type="range" min="1" max="10" value="1" step="1" id="count-range"
      oninput="document.getElementById('count-out').textContent=this.value+'枚'">
    <span class="count-label" id="count-out">1枚</span>
  </div>
  <p class="hint">長押しでシャッフル、離したらストップ</p>
  <div class="btn-wrap">
    <button id="draw-btn">カードを引く</button>
    <div class="progress-bar" id="progress"></div>
  </div>
</div>

<div id="result"><p class="placeholder">カードを引いてください</p></div>

const BADGE = {
  major:   ["major",   "大アルカナ"],
  wands:   ["wands",   "ワンド"],
  heart:   ["heart",   "ハート"],
  sword:   ["sword",   "ソード"],
  crystal: ["crystal", "クリスタル"],
};

function getRandomCards(n) {
  return [...ALL_CARDS].sort(() => Math.random() - 0.5).slice(0, n);
}

function renderCards(cards) {
  const n = cards.length;
  const grid = document.getElementById("result");
  grid.innerHTML = `<div class="grid">${cards.map(c => {
    const [cls, label] = BADGE[c.type];
    return `<div class="card">
      <img src="${c.img}" alt="${c.en}" loading="lazy">
      <div class="card-info">
        <div class="card-en">${c.en}</div>
        ${c.jp ? `<div class="card-jp">${c.jp}</div>` : ""}
        <span class="badge ${cls}">${label}</span>
      </div>
    </div>`;
  }).join("")}</div>`;
}

const btn = document.getElementById("draw-btn");
const progress = document.getElementById("progress");
let shuffleInterval = null;
let pressStart = null;
let progressAnim = null;

function startShuffle() {
  const n = parseInt(document.getElementById("count-range").value);
  pressStart = Date.now();
  btn.classList.add("shuffling");
  btn.textContent = "シャッフル中…";

  // Show shuffling cards rapidly
  shuffleInterval = setInterval(() => {
    renderCards(getRandomCards(n));
  }, 120);

  // Animate progress bar
  function animProgress() {
    const elapsed = Date.now() - pressStart;
    const pct = Math.min((elapsed / 5000) * 100, 100);
    progress.style.width = pct + "%";
    if (elapsed < 5000) {
      progressAnim = requestAnimationFrame(animProgress);
    } else {
      stopShuffle();
    }
  }
  progressAnim = requestAnimationFrame(animProgress);
}

function stopShuffle() {
  if (!shuffleInterval) return;
  clearInterval(shuffleInterval);
  shuffleInterval = null;
  cancelAnimationFrame(progressAnim);

  const n = parseInt(document.getElementById("count-range").value);
  renderCards(getRandomCards(n));

  btn.classList.remove("shuffling");
  btn.textContent = "カードを引く";
  progress.style.width = "0%";
  pressStart = null;
}

// Mouse events
btn.addEventListener("mousedown", startShuffle);
btn.addEventListener("mouseup", stopShuffle);
btn.addEventListener("mouseleave", stopShuffle);

// Touch events
btn.addEventListener("touchstart", (e) => { e.preventDefault(); startShuffle(); }, { passive: false });
btn.addEventListener("touchend", (e) => { e.preventDefault(); stopShuffle(); }, { passive: false });
</script>
