<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タロットカード</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
    background: #faf9f7;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  h1 {
    text-align: center;
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 2rem;
    color: #333;
    letter-spacing: 0.05em;
  }
  .controls {
    max-width: 480px;
    margin: 0 auto 2rem;
    background: #fff;
    border: 1px solid #e8e6e0;
    border-radius: 12px;
    padding: 1.5rem;
  }
  .range-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1.25rem;
  }
  .range-row label {
    font-size: 14px;
    color: #666;
    white-space: nowrap;
  }
  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    background: #e0ddd6;
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #5a4fcf;
    cursor: pointer;
  }
  .count-label {
    font-size: 14px;
    font-weight: 500;
    min-width: 32px;
    color: #1a1a1a;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #5a4fcf;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: background 0.15s;
  }
  button:hover { background: #4a3fbf; }
  button:active { background: #3a2faf; transform: scale(0.99); }
  .grid {
    max-width: 680px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    opacity: 1;
    transition: opacity 0.25s;
  }
  .grid.fade { opacity: 0; }
  .card {
    background: #fff;
    border: 1px solid #e8e6e0;
    border-radius: 12px;
    padding: 1.25rem 1rem;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .card-num { font-size: 11px; color: #999; }
  .card-en { font-size: 13px; font-weight: 500; color: #1a1a1a; line-height: 1.4; }
  .card-jp { font-size: 12px; color: #666; }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 6px;
    margin-top: 6px;
  }
  .major { background: #EEEDFE; color: #3C3489; }
  .wands { background: #FAEEDA; color: #633806; }
  .heart { background: #FBEAF0; color: #72243E; }
  .sword { background: #E6F1FB; color: #0C447C; }
  .crystal { background: #EAF3DE; color: #27500A; }
  .placeholder {
    max-width: 680px;
    margin: 0 auto;
    text-align: center;
    color: #aaa;
    font-size: 14px;
    padding: 3rem 0;
  }
</style>
</head>
<body>

<h1>タロットカード</h1>

<div class="controls">
  <div class="range-row">
    <label>枚数</label>
    <input type="range" min="1" max="10" value="1" step="1" id="count-range" oninput="document.getElementById('count-out').textContent=this.value+'枚'">
    <span class="count-label" id="count-out">1枚</span>
  </div>
  <button onclick="drawCards()">カードを引く</button>
</div>

<div id="result"><p class="placeholder">カードを引いてください</p></div>

const BADGE = {
  major:   ["major",   "大アルカナ"],
  wands:   ["wands",   "ワンド"],
  heart:   ["heart",   "ハート"],
  sword:   ["sword",   "ソード"],
  crystal: ["crystal", "クリスタル"],
};

function drawCards() {
  const n = parseInt(document.getElementById("count-range").value);
  const drawn = [...ALL_CARDS].sort(() => Math.random() - 0.5).slice(0, n);
  const result = document.getElementById("result");
  result.style.opacity = "0";
  setTimeout(() => {
    const grid = document.createElement("div");
    grid.className = "grid";
    grid.innerHTML = drawn.map(c => {
      const [cls, label] = BADGE[c.type];
      return `<div class="card">
        <div class="card-num">${c.num}</div>
        <div class="card-en">${c.en}</div>
        ${c.jp ? `<div class="card-jp">${c.jp}</div>` : ""}
        <span class="badge ${cls}">${label}</span>
      </div>`;
    }).join("");
    result.innerHTML = "";
    result.appendChild(grid);
    result.style.opacity = "1";
  }, 200);
}
</script>

</html>
